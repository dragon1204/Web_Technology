<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Vườn Thông Minh</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url("https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&fit=crop&w=1920&q=80") no-repeat center center;
      background-size: cover;
    }

    .overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
    }

    .dashboard {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 25px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px 60px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      color: #fff;
      text-align: center;
      max-width: 500px;
      width: 90%;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      color: #f1f1f1;
    }

    .subtitle {
      font-size: 1rem;
      color: #ddd;
      margin-bottom: 15px;
    }

    .sensor {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 25px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.15);
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
      transition: transform 0.3s ease;
    }

    .sensor:hover {
      transform: translateY(-5px);
    }

    .sensor .label {
      display: flex;
      align-items: center;
      font-size: 1.2rem;
      font-weight: 600;
    }

    .sensor .label span {
      margin-left: 10px;
    }

    .sensor .value {
      font-size: 1.6rem;
      font-weight: bold;
    }

    .temperature {
      border-left: 6px solid #ff6b6b;
    }

    .humidity {
      border-left: 6px solid #4dabf7;
    }

    .footer {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="dashboard">
    <h1>🌱 Vườn Thông Minh</h1>
    <div class="subtitle">Giám sát Nhiệt độ & Độ ẩm theo thời gian thực</div>

    <div class="sensor temperature">
      <div class="label">🌡️ <span>Nhiệt độ</span></div>
      <div class="value" id="temperature">-- °C</div>
    </div>

    <div class="sensor humidity">
      <div class="label">💧 <span>Độ ẩm</span></div>
      <div class="value" id="humidity">-- %</div>
    </div>

    <div class="footer">Made with ❤️ by IoT Team</div>
  </div>

  <script>
    // Kết nối tới WebSocket server
    const socket = io("http://159.223.61.25:3000", {
      transports: ["websocket"]
    });

    const tempEl = document.getElementById("temperature");
    const humEl = document.getElementById("humidity");

    socket.on("connect", () => {
      console.log("Kết nối WS thành công");
    });

    // Nhận dữ liệu từ backend
    socket.on("temperature", (t) => {
      tempEl.textContent = t + " °C";
    });

    socket.on("humidity", (h) => {
      humEl.textContent = h + " %";
    });
  </script>
</body>
</html>
