version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: web_tech_db
    environment:
      POSTGRES_DB: web_technology
      POSTGRES_USER: webtech_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_this_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webtech_user -d web_technology"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local



